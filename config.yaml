# config.yaml
# Settings you can change without touching Python code.
# YAML basics: "key: value" pairs, and lists use "- item" lines.

# Which email senders count as job alerts.
# To add a new job board, add one more "- address" line.
# Note: if you forward LinkedIn alerts from your second email using
# automatic forwarding, the original "From" address is kept, so they
# will still match the LinkedIn senders below.
#
# jobs-noreply@linkedin.com is NOT listed here on purpose: checked on
# Oct 7, 2026, it sends "your application was sent" confirmations,
# not alerts. Stage 3 uses those emails to detect jobs you applied to.
alert_senders:
  - jobalerts-noreply@linkedin.com
  - donotreply@jobalert.indeed.com
  - donotreply@match.indeed.com
  - support@builtin.com
  - dice@connect.dice.com
  - team@hi.wellfound.com

# You run this on demand, not on a schedule. Each run picks up where the
# last run left off (the last run time is saved in the Google Sheet, step 3).
# This setting is only used when there is no previous run yet.
first_run_lookback_days: 7

# Which Claude model does which job.
# All Haiku: cheapest. For sharper scores, set score to claude-sonnet-5-5 (~10x the cost).
models:
  extract: claude-haiku-5-5     # stage 2: pull jobs out of emails
  describe: claude-haiku-5-5    # stage 5: find full job descriptions
  score: claude-haiku-5-5       # stage 6: score each job against your profile
  status: claude-haiku-5-5      # stage 3: read application / rejection / interview emails

# Where jobs are stored (BigQuery, free sandbox mode).
bigquery:
  project: job-alert-agent-511001
  dataset: job_alerts

# Stage 3: emails that change a job's status.
# Gmail is searched for ANY of these phrases; Claude then reads each match
# and decides if it's really an application, rejection, or interview email.
status_phrases:
  - "your application was sent"
  - "thank you for applying"
  - "thanks for applying"
  - "application received"
  - "received your application"
  - "unfortunately"
  - "not moving forward"
  - "other candidates"
  - "schedule an interview"
  - "interview invitation"
  - "next steps"

# The very first run looks this far back for status emails,
# to catch jobs you already applied to. Later runs only read new emails.
first_run_status_lookback_days: 90

# Stage 4: filters.
filters:
  # Titles with any of these words are too senior (whole-word match).
  too_senior_words:
    - Principal
    - Staff
    - Director
    - VP
    - Vice President
    - Head of
  # Titles with any of these are clearly unrelated (free, no AI needed).
  unrelated_keywords:
    - nurse
    - nursing
    - RN
    - LPN
    - driver
    - CDL
    - sales representative
    - sales rep
    - cashier
    - technician
    - warehouse associate
    - warehouse worker
    - mechanic
  # Salary, judged by the top of the posted range (jobs with no salary are kept).
  salary_floor: 100000    # below this: flagged, listed at the end of the digest
  salary_target: 120000   # below this: flagged, scored a bit lower
  below_floor_min_fit: 75 # below-floor jobs appear in the digest only at this experience fit or higher
  # The roles you want. Claude uses this list to catch other unrelated titles.
  target_roles:
    - Data Engineer
    - Analytics Engineer
    - Data Architect
    - AI Engineer
    - Data Analyst
    - BI / Analytics developer, lead, or manager
    - Database Administrator / Developer (SQL Server)
    - Technical Program Manager / Technical Project Manager
    - Product Manager (data or technical)
    - Data team lead or manager

# Stage 7: the digest email (scores are 0-100).
digest:
  apply_experience_min: 70   # "Apply today": experience fit at least this...
  apply_preferences_min: 60  # ...and preferences fit at least this
  maybe_experience_min: 55   # "Maybe": experience fit at least this (not in Apply today)
